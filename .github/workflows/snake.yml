name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3

        with:
          github_user_name: saptadeep12

          outputs: |
            dist/snake-mars.svg?color_snake=#ff6a3d&color_dots=#1a0f0a,#5c2410,#8b3a1a,#c1440e,#e27b58&color_dot_border=#000000

      - name: Publish generated SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}